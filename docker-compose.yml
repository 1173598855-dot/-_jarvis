services:
  jarvis:
    container_name: jarvis-app
    build: .
    ports:
      - "127.0.0.1:5173:5173"  # Vite 前端仅发布到宿主机回环地址
      - "127.0.0.1:9999:9999"  # Express 后端仅发布到宿主机回环地址
    volumes:
      - ./src:/app/src
    environment:
      - NODE_ENV=development
      - JARVIS_HOST=0.0.0.0
    restart: unless-stopped
