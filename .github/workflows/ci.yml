name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m ruff check src/ tests/ scripts/

  python-contracts:
    runs-on: ubuntu-latest
    # Job-level backstop only. Both Python test steps below enforce their own
    # per-command deadlines, so a hang is reported with the offending test
    # instead of being truncated by this cap.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: npm ci
        working-directory: frontend
      - run: python tests/run_all.py --timeout 1800 --json-report run-all-report.json
      - run: python scripts/discover_tests.py --timeout 1800 --json-report discover-report.json
      - run: python -m compileall -q src tests scripts
      - run: python scripts/ci_local_integration.py --require-services --overall-timeout 900  # uses scripts/local_ollama_fixture.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: |
            run-all-report.json
            discover-report.json
          if-no-files-found: warn

  macos-sandbox:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m unittest tests.test_worker_macos_sandbox tests.test_macos_sandbox_enforcement -v

  linux-sandbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m unittest tests.test_worker_network_isolation tests.test_worker_filesystem_isolation tests.test_linux_worker_isolation_enforcement tests.test_linux_plugin_runtime_enforcement tests.test_linux_terminal_worker_enforcement -v
        env:
          JARVIS_RUN_LINUX_ISOLATION_ENFORCEMENT: "1"
          JARVIS_RUN_LINUX_PLUGIN_RUNTIME_ENFORCEMENT: "1"
          JARVIS_RUN_LINUX_TERMINAL_WORKER_ENFORCEMENT: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
