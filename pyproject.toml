[project]
name = "xiaoyi-jarvis"
version = "1.0.0"
description = "小奕 J.A.R.V.I.S. 自主演进引擎"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.38.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx2>=2.5.0",
]

[project.scripts]
jarvis = "src.main:run_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
